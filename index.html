<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бункер</title>
<style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)],cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const AN=['лиса','волк','кот','медведь','кролик','ворон','олень','барсук','лев','крыса','енот','сова','змея','ящерица'],
MT=['камень','глина','железо','дерево','лёд','золото','стекло','мясо','сыр','песок','бумага','хлеб','воск'],
LM=['левая рука','правая рука','левая нога','правая нога','обе ноги','кисть руки','стопа','пальцы'];
const L={'Профессии':'Профессия','Спец. возможности':'Спец. возможность','Доп. сведенья':'Доп. сведения'},lab=g=>g.map(n=>L[n]||n).join(' / ');
const yrs=n=>n%10==1&&n%100!=11?'год':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'года':'лет';
firebase.initializeApp({apiKey:'AIzaSyCcNv5vEXpdwNrvAQodgYc_bKMo8p_UrAk',authDomain:'bunker-ad1fb.firebaseapp.com',databaseURL:'https://bunker-ad1fb-default-rtdb.firebaseio.com',projectId:'bunker-ad1fb',appId:'1:314157592540:web:f21d380d4b0852d477a919'});
const db=firebase.database();let RC,UID,_u=null;
let S,V,isHost=false,lastSeq=null,tok=sessionStorage.btok||(sessionStorage.btok=Math.random().toString(36).slice(2));
const P=id=>S.pl.find(q=>q.id==id),lg=t=>{S.log.push(t);if(S.log.length>150)S.log.shift()},
oth=p=>{const a=S.pl.filter(q=>q!==p);return a.length?pick(a).name:'?'};

/* ---------- файл сценария ---------- */
function parse(tx){const cats=[];let c=null;for(let l of tx.split(/\r?\n/)){l=l.trim();if(!l)continue;
 const m=l.match(/^([A-Za-zА-Яа-яЁё. ]{2,24}?):\s*(.*)$/);
 if(m){c={n:m[1].trim(),items:[],g:null};cats.push(c);const g=m[2].match(/^[А-Яа-яЁё]+\s*:\s*(.+)$/);
  if(g)c.g=g[1].split(';')[0].split(' - ').map(s=>s.trim()).filter(Boolean)}
 else if(c)c.items.push(l)}
 return{cats:cats.filter(c=>c.items.length||/^(Рост|Возраст|Пол)/.test(c.n))}}
function plan(){const names=S.sc.cats.map(c=>c.n),used=new Set(),pl=[],
 gs=S.gtxt.split(';').map(g=>g.split('+').map(s=>s.trim()).filter(n=>names.includes(n)));
 for(const c of names){if(used.has(c))continue;const g=gs.find(g=>g.includes(c))||[c];g.forEach(x=>used.add(x));pl.push(g)}return pl}

/* ---------- генерация ---------- */
function res(t,sx,p){const rn=()=>{const c=S.sc.cats.find(c=>/^Раса/.test(c.n));return c?pick(c.items).replace(/\(.*?\)/g,'').trim():'человек'};
 t=t.replace(/\(вид животного\)/,()=>'('+pick(AN)+')').replace(/\(вид материала\)/,()=>'('+pick(MT)+')')
  .replace(/\(тип конечности\)/,()=>'('+pick(LM)+')').replace(/\(тип расы\)/,()=>'('+rn()+')');
 const m=t.match(/^([^/]+)\/([^(]+?)\s*\(в зависимости от пола\)/);
 if(m){const f=/^Сукк/.test(m[1])?sx=='ж':sx=='м';t=(f?m[1]:m[2]).trim()}
 t=t.replace(/"имя другого игрока"/,'«'+oth(p)+'»');
 if(/родственником одного из присутствующих/.test(t))t+=' ('+oth(p)+')';return t.trim()}
function gen(c,sx,p,keep){const n=c.n;
 if(/^Рост/.test(n))return{t:rnd(30,300)+' см'};
 if(/^Возраст/.test(n)){const a=rnd(1,1000);return{t:a+' '+yrs(a)}}
 if(/^Пол/.test(n))return{t:sx=='м'?'Мужской':'Женский'};
 const gi=c.g?rnd(0,c.g.length-1):null;
 if(/^Здоровье/.test(n)&&gi===0)return{t:cap(c.g[0]),gi:0,b:''};
 const tk=S.taken[n]||(S.taken[n]=new Set()),av=c.items.filter(i=>!tk.has(i)),it=pick(av.length?av:c.items);if(keep)tk.add(it);
 let nm=it,ab='';if(/^Професс/.test(n)){const m=it.match(/^(.+?) - (.+)$/);if(m){nm=m[1];ab=m[2]}}
 nm=res(nm.trim(),sx,p);const sp=/^Спец/.test(n);if(sp)ab=nm;
 return{t:c.g?`${nm} (${c.g[gi]})`+(ab&&!sp?' — '+ab:''):nm,b:nm,gi,ab}}
function mk(cn,p,keep=1){const ps=cn.map(n=>gen(S.sc.cats.find(c=>c.n==n),p.sx,p,keep)),f={t:ps.map(x=>x.t).join(' · '),ab:ps[0].ab||'',b:ps[0].b,gi:ps[0].gi,cn};
 if(/^Професс/.test(cn[0])&&/^Охотник за головами/.test(f.b||''))f.p='Цель: '+oth(p);return f}
function deal(p){p.f=[];p.x=[];p.sx=Math.random()<.5?'м':'ж';
 for(const g of S.plan){const n=/^Спец/.test(g[0])?2:1;for(let j=0;j<n;j++){const f=mk(g,p);f.k=lab(g)+(n>1?' '+(j+1):'');f.r=f.u=false;
  const ru=RULES.find(x=>x.r.test(f.ab||f.t));f.use=/^(Професс|Спец)/.test(g[0])&&!(ru&&ru.auto);p.f.push(f)}}
 if(p.f.some(f=>/^Бродячий торговец/.test(f.b||'')))p.x.push({t:'Свиток Желаний',r:false})}

/* ---------- способности ---------- */
const ex=(p,t)=>p.x.push({t,r:false}),gf=(q,k)=>q.f.find(f=>f.k==k),
rr=(q,f)=>{if(f.lock||/^Пол/.test(f.cn[0]))return;const n=mk(f.cn,q);Object.assign(f,{t:n.t,ab:n.ab,b:n.b,gi:n.gi,p:n.p})},
hf=q=>q.f.find(f=>/^Здоровье/.test(f.cn[0])),lvl=()=>S.sc.cats.find(c=>/^Здоровье/.test(c.n)).g,
sh=(f,g)=>{f.gi=g;f.t=g?`${f.b} (${lvl()[g]})`:cap(lvl()[0])},
sw=(a,b)=>['t','ab','b','gi','p'].forEach(k=>{[a[k],b[k]]=[b[k],a[k]]}),
others=p=>S.pl.filter(q=>q.al&&q!==p);
const RULES=[
{r:/перебрасывать результат кубика|Всегда добавляй \+2/,auto:1},
{r:/выклянчить/,f:p=>{const c=S.sc.cats.filter(c=>/^(Подсумок|Телега)/.test(c.n));if(!c.length)return false;ex(p,pick(pick(c).items).trim());return p.name+' выклянчивает себе предмет'}},
{r:/добавить в инвентарь (?!предмет)/,f:(p,m,t)=>{const x=t.match(/добавить в инвентарь (.+?)(?: или |\(| которые|$)/)[1].trim();ex(p,x);return `${p.name} добавляет в инвентарь: ${x}`}},
{r:/скопировать профессию/,n:'t',f:(p,m)=>{const q=P(m.t),f=q.f.find(f=>/^Професс/.test(f.cn[0]));if(!f)return false;ex(p,'Профессия (копия): '+f.b);return `${p.name} копирует профессию игрока ${q.name}`}},
{r:/изменить характер/,n:'t',f:(p,m)=>{const q=P(m.t),f=q.f.find(f=>/^Черта/.test(f.cn[0]));if(!f)return false;rr(q,f);return `${p.name} меняет характер игрока ${q.name} на случайный`}},
{r:/уменьшить степень болезни/,n:'t',f:(p,m)=>{const q=P(m.t),f=hf(q);if(!f||f.gi==null||f.gi<2)return false;sh(f,f.gi-1);return `${p.name} облегчает болезнь игрока ${q.name} на 1 ступень`}},
{r:/устранить физический недуг|вылечить одного игрока/,n:'t',f:(p,m)=>{const q=P(m.t),f=hf(q);if(!f||f.gi==null||f.gi<1||f.gi>=lvl().length-1)return false;sh(f,0);return `${p.name} лечит игрока ${q.name}`}},
{r:/вернутся в игру/,d:1,f:p=>{if(p.al)return false;deal(p);p.al=true;return `${p.name} возвращается в игру новым персонажем`}},
{r:/отменить своё исключение/,d:1,f:p=>{if(p.al)return false;p.al=true;return `${p.name} отменяет своё исключение`}},
{r:/избежать изгнания/,f:p=>{p.imm=1;return `${p.name} готовится избежать изгнания`}},
{r:/защитить одного игрока от исключения/,n:'t',f:(p,m)=>{P(m.t).prot=1;return `${p.name} защищает игрока ${P(m.t).name} от исключения в этом раунде`}},
{r:/голос считается за два/,f:p=>{p.dbl=1;return `${p.name}: голос считается за два в этом раунде`}},
{r:/отменить один голос/,f:p=>{p.cnl=1;return `${p.name} отменит один голос против себя в этом раунде`}},
{r:/дуэлью/,f:p=>{const a=others(p);if(a.length<2)return false;const d=[];while(d.length<2)d.push(a.splice(rnd(0,a.length-1),1)[0].id);S.duel=d;return `${p.name} объявляет дуэль! В ближайшем голосовании участвуют только ${d.map(x=>P(x).name).join(' и ')}`}},
{r:/перебросить любую случайную|вытянуть случайную характеристику/,f:p=>{const a=p.f.filter(f=>!f.lock);if(!a.length)return false;rr(p,pick(a));return `${p.name} перебрасывает одну из своих характеристик`}},
{r:/вытянуть определенную/,n:'k',f:(p,m)=>{const f=gf(p,m.k);if(!f)return false;rr(p,f);return `${p.name} перебрасывает характеристику «${m.k}»`}},
{r:/раскрыть одну случайную/,f:p=>{const a=others(p).filter(q=>q.f.some(f=>!f.r));if(!a.length)return false;const q=pick(a),f=pick(q.f.filter(f=>!f.r));f.r=1;return `${q.name} вынужден раскрыть «${f.k}»: ${f.t}`}},
{r:/открыть одну свою/,n:'k',f:(p,m)=>{const f=gf(p,m.k);if(!f||f.r)return false;f.r=1;return `${p.name} открывает «${f.k}»: ${f.t}`}},
{r:/дополнительную характеристику/,n:t=>/определенному/.test(t)?'t':'',f:(p,m,t)=>{const q=/определенному/.test(t)?P(m.t):pick(others(p));if(!q)return false;ex(q,mk(pick(S.plan.filter(g=>!/^Спец/.test(g[0]))),q).t);return `${p.name} добавляет игроку ${q.name} дополнительную характеристику`}},
{r:/украсть характеристику/,n:'tk',f:(p,m)=>{const q=P(m.t),f=gf(q,m.k);if(!f||f.lock)return false;ex(p,f.t);rr(q,f);return `${p.name} крадёт у ${q.name} характеристику «${m.k}»`}},
{r:/скопировать характеристику/,n:'tk',f:(p,m)=>{const q=P(m.t),f=gf(q,m.k);if(!f)return false;ex(p,f.t);return `${p.name} копирует у ${q.name} характеристику «${m.k}»`}},
{r:/обменять характеристику/,n:'tk',f:(p,m)=>{const q=P(m.t),f=gf(q,m.k),g=gf(p,m.k);if(!f||!g||f.lock||g.lock)return false;sw(f,g);return `${p.name} обменивается с ${q.name} характеристикой «${m.k}»`}},
{r:/поменяться характеристиками/,n:'tk',f:(p,m)=>{const q=P(m.t);if(!gf(q,m.k))return false;S.asks.push({id:S.aid++,from:p.id,to:q.id,k:m.k});return `${p.name} предлагает ${q.name} поменяться характеристикой «${m.k}»`}},
{r:/изъять один предмет/,n:'tk',f:(p,m)=>{const q=P(m.t),f=gf(q,m.k);if(!f||!/^(Подсумок|Телега)/.test(f.cn[0]))return false;ex(p,f.t);f.t='(изъято)';return `${p.name} изымает предмет у ${q.name}`}},
{r:/сжечь любой предмет/,n:'tk',f:(p,m)=>{const q=P(m.t),f=gf(q,m.k);if(!f||!/^(Подсумок|Телега)/.test(f.cn[0]))return false;f.t='(сожжено)';return `${p.name} сжигает предмет игрока ${q.name}`}},
{r:/защитить одну свою/,n:'k',f:(p,m)=>{const f=gf(p,m.k);if(!f)return false;f.lock=1;return `${p.name} защищает свою характеристику от изменений`}},
{r:/цель известна/,f:()=>({s:1})}
];
const needs=(ru,t)=>ru?(typeof ru.n=='function'?ru.n(t):ru.n||''):'';

/* ---------- голосование ---------- */
function tally(){const v=S.vote,c={};for(const[k,t]of Object.entries(v.v))c[t]=(c[t]||0)+(P(+k).dbl?2:1);
 for(const id of v.c){const q=P(id);if(q.cnl&&c[id])c[id]--;if(q.prot)c[id]=0}
 S.pl.forEach(q=>{q.dbl=q.cnl=q.prot=0});v.open=0;
 v.res=v.c.map(id=>({id,n:c[id]||0,imm:!!P(id).imm})).sort((a,b)=>b.n-a.n);
 lg('Итоги голосования: '+v.res.map(r=>`${P(r.id).name} — ${r.n}`).join(', '))}
const elig=()=>S.pl.filter(q=>q.al&&!(S.vote.duel&&S.vote.c.includes(q.id)));

/* ---------- действия (выполняет хост) ---------- */
function act(i,m){const p=P(i);if(!p)return;const h=!!p.host,A=m.a;
 if(A=='cb'&&h){S.cat=String(m.c).slice(0,1500);S.bun=String(m.b).slice(0,1500)}
 else if(A=='grp'&&h&&S.ph=='lobby')S.gtxt=String(m.g);
 else if(A=='start'&&h&&S.sc&&S.ph=='lobby'&&S.pl.length>1){S.plan=plan();S.taken={};S.ph='game';S.pl.forEach(deal);S.labels=S.pl[0].f.map(f=>f.k);lg('Игра началась')}
 else if(S.ph!='game')return;
 else if(A=='rev'){const f=p.f[m.fi];if(f)f.r=1}
 else if(A=='revx'){const x=p.x[m.i];if(x)x.r=1}
 else if(A=='use'){const f=p.f[m.fi];if(!f||!f.use||f.u)return;const t=f.ab||f.t,ru=RULES.find(x=>x.r.test(t)),n=needs(ru,t);
  if(!p.al&&!(ru&&ru.d))return;if(n.includes('t')&&!(P(m.t)&&P(m.t).al&&m.t!=i))return;if(n.includes('k')&&!S.labels.includes(m.k))return;
  let r=ru&&ru.f?ru.f(p,m,t):null;if(r===false)return render();f.u=1;let sec=0;if(r&&r.s){sec=1;r=null}
  if(!sec){f.r=1;lg(r||`${p.name} применяет способность: ${t}`)}}
 else if(A=='roll'||A=='reroll'){let n,md;
  if(A=='reroll'){if(!p.lr||!p.f.some(f=>f.r&&/перебрасывать результат кубика/.test(f.ab||f.t)))return;({n,md}=p.lr)}
  else{n=Math.max(1,Math.min(10,+m.n||1));md=Math.max(-50,Math.min(50,+m.md||0))}
  p.lr={n,md};const r=Array.from({length:n},()=>rnd(1,20)),b=p.f.some(f=>f.r&&/Всегда добавляй \+2/.test(f.ab||f.t))?2:0,s=r.reduce((x,y)=>x+y,0)+md+b;
  S.roll={seq:S.roll.seq+1,t:`${p.name}: ${s}`};lg(`🎲 ${p.name}: ${n}×d20 [${r.join(', ')}]${md?(md>0?' +':' ')+md:''}${b?' +2 (способность)':''} = ${s}`)}
 else if(A=='gen'){const cs=S.sc.cats,c=cs.find(x=>x.n==m.c)||pick(cs);lg(`🎲 Генератор (${p.name}), ${c.n}: ${gen(c,p.sx,p,0).t}`)}
 else if(A=='vote'){const v=S.vote;if(!v||!v.open||!p.al||!v.c.includes(m.to)||m.to==i||(v.duel&&v.c.includes(i)))return;v.v[i]=m.to;if(elig().every(q=>v.v[q.id]!=null))tally()}
 else if(A=='ans'){const a=S.asks.find(a=>a.id==m.id&&a.to==i);if(!a)return;S.asks=S.asks.filter(x=>x!==a);
  if(m.y){const o=P(a.from),f=gf(o,a.k),g=gf(p,a.k);if(f&&g&&!f.lock&&!g.lock){sw(f,g);lg(`${p.name} соглашается поменяться характеристикой «${a.k}» с ${o.name}`)}}else lg(`${p.name} отказывается меняться`)}
 else if(!h)return;
 else if(A=='vopen'){const al=S.pl.filter(q=>q.al);if(al.length<2)return;S.round++;S.vote={open:1,c:S.duel||al.map(q=>q.id),v:{},res:null,duel:!!S.duel};lg(S.duel?`Раунд ${S.round}: дуэль! Голосуют все, кроме дуэлянтов`:`Раунд ${S.round}: голосование за изгнание`);S.duel=null}
 else if(A=='vclose'){if(S.vote&&S.vote.open)tally()}
 else if(A=='expel'){const q=P(m.pid);if(!q)return;if(q.al&&q.imm){q.imm=0;lg(`${q.name} избегает изгнания`)}else{q.al=!q.al;lg(q.al?`${q.name} возвращён в игру`:`${q.name} изгнан`)}}
 else if(A=='hre'){const q=P(m.pid),f=q&&gf(q,m.k);if(f){rr(q,f);lg(`Хост меняет у ${q.name} характеристику «${m.k}»`)}}
 else if(A=='hnew'){const q=P(m.pid);if(q){deal(q);lg(`Хост выдаёт ${q.name} новую карточку`)}}
 render()}

/* ---------- сеть ---------- */
function view(p){const own=q=>q===p;return{me:p.id,h:!!p.host,code:S.code,ph:S.ph,cat:S.cat,bun:S.bun,log:S.log.slice(-60),round:S.round,duel:!!S.duel,
 vote:S.vote&&{open:S.vote.open,c:S.vote.c,duel:S.vote.duel,vd:Object.keys(S.vote.v).map(Number),res:S.vote.res},roll:S.roll,
 asks:S.asks.filter(a=>a.to==p.id).map(a=>({id:a.id,f:P(a.from).name,k:a.k})),labels:S.labels||[],cn:S.sc?S.sc.cats.map(c=>c.n):[],grp:S.gtxt,sc:!!S.sc,
 pl:S.pl.map(q=>({id:q.id,n:q.name,al:q.al,h:!!q.host,on:!!(q.host||q.on),
  f:S.ph=='game'?q.f.map(f=>({k:f.k,r:f.r,u:f.u,use:own(q)&&f.use,t:(own(q)||f.r)?f.t:null,p:own(q)?f.p:null,a:own(q)?(f.ab||f.t):null})):[],
  x:q.x.map(x=>({t:(own(q)||x.r)?x.t:null})),}))}}
const norm=v=>{v.pl=(v.pl||[]).map(q=>({...q,f:q.f||[],x:q.x||[]}));['asks','log','labels','cn'].forEach(k=>v[k]=v[k]||[]);if(v.vote){v.vote.c=v.vote.c||[];v.vote.vd=v.vote.vd||[]}return v};
function render(){const u={};S.pl.forEach(p=>{const v=JSON.parse(JSON.stringify(view(p)));if(p.host){V=norm(JSON.parse(JSON.stringify(v)));draw()}u['view/'+p.uid]=v});db.ref('rooms/'+S.code).update(u).catch(er=>setSt('Ошибка записи: '+er.message))}
function onJoin(sn){const u=sn.key,j=sn.val()||{};let p=S.pl.find(q=>q.uid==u);
 if(!p){const er=m=>db.ref(`rooms/${S.code}/view/${u}`).set({err:m});if(S.ph!='lobby')return er('Игра уже идёт');if(S.pl.length>=12)return er('Комната заполнена (12 игроков)');
  S.pl.push({id:S.nid++,name:String(j.n||'Игрок').slice(0,20),uid:u,al:true,f:[],x:[]})}render()}
function onAct(sn){const a=sn.val()||{};sn.ref.remove();const p=S.pl.find(q=>q.uid==a.u);if(p&&a.m)act(p.id,a.m)}
function onPres(sn){const v=sn.val()||{};S.pl.forEach(p=>{p.on=!!v[p.uid]});render()}
async function login(){if(_u)return _u;const a=firebase.auth();await a.setPersistence(firebase.auth.Auth.Persistence.SESSION);return _u=(await a.signInAnonymously()).user.uid}
const newS=c=>({code:c,ph:'lobby',pl:[],sc:null,gtxt:'',plan:[],labels:[],cat:'',bun:'',log:[],vote:null,duel:null,round:0,roll:{seq:0,t:''},asks:[],aid:1,nid:1,taken:{}});
async function mkH(){const name=$('#nm').value.trim()||'Хост';setSt('Создаю комнату…');
 try{const uid=await login(),A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c=null;
  for(let i=0;i<6&&!c;i++){const t=Array.from({length:4},()=>A[rnd(0,A.length-1)]).join('');try{await db.ref('rooms/'+t+'/host').set(uid);c=t}catch(x){}}
  if(!c)return setSt('Не удалось создать комнату. Проверьте правила базы (вкладка Rules) и включён ли анонимный вход.');
  isHost=true;RC=c;UID=uid;S=newS(c);S.pl.push({id:0,name,uid,host:1,al:true,f:[],x:[]});S.nid=1;
  const r=db.ref('rooms/'+c);r.child('join').on('child_added',onJoin);r.child('join').on('child_changed',onJoin);r.child('act').on('child_added',onAct);r.child('pres').on('value',onPres);render()
 }catch(er){setSt('Ошибка: '+(er.message||er))}}
const setSt=t=>{const s=$('#st');if(s)s.textContent=t;else alert(t)};
async function jn(){const name=$('#nm').value.trim()||'Игрок',c=$('#cd').value.trim().toUpperCase();if(!c)return setSt('Введите код комнаты');
 setSt('Подключаюсь…');
 try{const uid=await login(),h=await db.ref('rooms/'+c+'/host').once('value');
  if(!h.exists())return setSt('Комната с кодом '+c+' не найдена. Хост должен сначала создать комнату.');
  RC=c;UID=uid;const pr=db.ref(`rooms/${c}/pres/${uid}`);
  db.ref('.info/connected').on('value',x=>{if(x.val()){pr.onDisconnect().remove();pr.set(true)}});
  db.ref(`rooms/${c}/view/${uid}`).on('value',x=>{const v=x.val();if(!v)return;if(v.err)return setSt(v.err);V=norm(v);draw()});
  await db.ref(`rooms/${c}/join/${uid}`).set({n:name,t:Date.now()});
  setTimeout(()=>{if(!V)setSt('Хост не отвечает. Пусть хост обновит страницу и создаст комнату заново.')},15000)
 }catch(er){setSt('Ошибка: '+(er.message||er))}}
const snd=m=>isHost?act(0,m):db.ref('rooms/'+RC+'/act').push({u:UID,m});
function ld(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.sc=parse(r.result);const n=S.sc.cats.map(c=>c.n);
 S.gtxt=[['Рост','Телосложение'],['Раса','Возраст','Пол']].map(g=>g.filter(x=>n.includes(x))).filter(g=>g.length).map(g=>g.join('+')).join('; ');render()};r.readAsText(f,'utf-8')}

/* ---------- интерфейс ---------- */
function pop(n,cb){const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class=md>${n.includes('t')?`Цель: <select id=pt>${V.pl.filter(p=>p.id!=V.me&&p.al).map(p=>`<option value=${p.id}>${e(p.n)}</option>`).join('')}</select>`:''}${n.includes('k')?`Характеристика: <select id=pk>${V.labels.map(l=>`<option>${e(l)}</option>`).join('')}</select>`:''}<div><button id=ok>OK</button> <button id=cx>Отмена</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#cx').onclick=()=>d.remove();
 d.querySelector('#ok').onclick=()=>{const o={};if(n.includes('t'))o.t=+d.querySelector('#pt').value;if(n.includes('k'))o.k=d.querySelector('#pk').value;d.remove();cb(o)}}
function ab(i){const f=V.pl.find(p=>p.id==V.me).f[i],ru=RULES.find(x=>x.r.test(f.a)),n=needs(ru,f.a);
 if(!n)snd({a:'use',fi:i});else pop(n,o=>snd({a:'use',fi:i,...o}))}
const cb=()=>snd({a:'cb',c:$('#tc').value,b:$('#tb').value}),md=d=>{$('#dm').value=+$('#dm').value+d};
function home(){const r=new URLSearchParams(location.search).get('r')||'';
 $('#app').innerHTML=`<h2>Бункер</h2><p><input id=nm placeholder="Ваше имя" maxlength=20></p><p><button onclick="mkH()">Создать комнату</button></p><p><input id=cd placeholder="Код комнаты" value="${e(r)}" maxlength=4 size=8> <button onclick="jn()">Войти</button></p><p id=st></p>`}
const lobby=()=>`<h2>Бункер — комната ${e(V.code)}</h2><p>Ссылка для друзей: <input readonly size=42 value="${e(location.origin+location.pathname+'?r='+V.code)}" onclick="this.select()"></p><h3>Игроки (${V.pl.length}/12)</h3>${V.pl.map(p=>`<div>${e(p.n)}${p.h?' (хост)':''}${p.on?'':' — не в сети'}</div>`).join('')}`+
 (V.h?`<h3>Сценарий</h3><input type=file accept=".txt" onchange="ld(this)"> ${V.sc?'✔ загружен':''}<p>Объединённые поля (группы через «;», названия через «+»):<br><input id=gt size=60 value="${e(V.grp)}" onchange="snd({a:'grp',g:this.value})"></p><button onclick="snd({a:'start'})">Старт</button> <small>нужно минимум 2 игрока и файл сценария</small>`:'<p>Ждём, пока хост начнёт игру…</p>');
const topbar=()=>`<div class=c><b>Комната ${e(V.code)}</b>, раунд ${V.round}<div class=row><div style="flex:1 1 250px"><b>Катаклизм</b>${V.h?`<textarea id=tc rows=3 style="width:100%;box-sizing:border-box" onchange="cb()">${e(V.cat)}</textarea>`:`<div>${e(V.cat)||'—'}</div>`}</div><div style="flex:1 1 250px"><b>Бункер</b>${V.h?`<textarea id=tb rows=3 style="width:100%;box-sizing:border-box" onchange="cb()">${e(V.bun)}</textarea>`:`<div>${e(V.bun)||'—'}</div>`}</div></div></div>`;
function card(q){const o=q.id==V.me;return `<div class="c ${q.al?'':'d'}"><b>${e(q.n)}</b>${o?' (вы)':''}${q.al?'':' — ИЗГНАН'}${q.on?'':' ⚠ не в сети'}`+
 q.f.map((f,i)=>`<div class="f ${f.r?'r':''}"><b>${e(f.k)}:</b> ${f.t==null?'<i>скрыто</i>':e(f.t)}${f.p?` <small>(${e(f.p)})</small>`:''}${o&&!f.r?` <button onclick="snd({a:'rev',fi:${i}})">Раскрыть</button>`:''}${o&&f.use&&!f.u?` <button onclick="ab(${i})">Применить</button>`:''}</div>`).join('')+
 (q.x.length?'<div class=f><b>Дополнительно:</b></div>'+q.x.map((x,i)=>`<div class=f>• ${x.t==null?'<i>скрыто</i>':e(x.t)}${o&&x.t!=null&&!x.r?` <button onclick="snd({a:'revx',i:${i}})">Раскрыть</button>`:''}</div>`).join(''):'')+
 (V.h&&!o?`<div class=f><select id=hs${q.id}>${V.labels.map(l=>`<option>${e(l)}</option>`).join('')}</select> <button onclick="snd({a:'hre',pid:${q.id},k:$('#hs${q.id}').value})">↻</button> <button onclick="snd({a:'hnew',pid:${q.id}})">Новая карточка</button></div>`:'')+
 (V.h?`<button onclick="snd({a:'expel',pid:${q.id}})">${q.al?'Изгнать':'Вернуть'}</button>`:'')+'</div>'}
function side(){const vt=V.vote,me=V.pl.find(p=>p.id==V.me),nm=id=>e(V.pl.find(p=>p.id==id).n);
 let s=V.asks.map(a=>`<div class=c>${e(a.f)} предлагает поменяться «${e(a.k)}» <button onclick="snd({a:'ans',id:${a.id},y:1})">Согласен</button> <button onclick="snd({a:'ans',id:${a.id},y:0})">Отказаться</button></div>`).join('');
 s+=`<div class=c><b>Кубик d20</b><div id=dv style="font-size:20px;margin:6px 0">${e(V.roll.t)||'—'}</div>Кубиков <input id=dn type=number min=1 max=10 value=1 style="width:50px"> Бонус <button onclick="md(-1)">−</button><input id=dm type=number value=0 style="width:55px"><button onclick="md(1)">+</button> <button onclick="snd({a:'roll',n:$('#dn').value,md:$('#dm').value})">Бросить</button>${me.f.some(f=>f.r&&/перебрасывать результат кубика/.test(f.a||''))?' <button onclick="snd({a:\'reroll\'})">Перебросить</button>':''}</div>`;
 s+=`<div class=c><b>Голосование</b> ${V.h?`<button onclick="snd({a:'vopen'})">Начать</button>${vt&&vt.open?` <button onclick="snd({a:'vclose'})">Закрыть</button>`:''}`:''}`+(V.duel?'<div>Следующее голосование — дуэль</div>':'');
 if(vt&&vt.open){const can=me.al&&!(vt.duel&&vt.c.includes(V.me));s+=`<div>Проголосовало: ${vt.vd.length}</div>`+(can?(vt.vd.includes(V.me)?'<div>Ваш голос принят</div>':vt.c.filter(id=>id!=V.me).map(id=>`<div><button onclick="snd({a:'vote',to:${id}})">${nm(id)}</button></div>`).join('')):'<div>Вы не голосуете</div>')}
 else if(vt&&vt.res)s+=vt.res.map(r=>`<div>${nm(r.id)} — ${r.n}${V.h&&r.imm?' <small>(может избежать изгнания)</small>':''}</div>`).join('')+(V.h?'<small>Изгнать можно кнопкой в карточке</small>':'');
 s+='</div>';
 s+=`<div class=c><b>Генератор</b><br><select id=gc>${V.cn.map(n=>`<option>${e(n)}</option>`).join('')}</select> <button onclick="snd({a:'gen',c:$('#gc').value})">Получить</button> <button onclick="snd({a:'gen'})">Случайная</button></div>`;
 return s+`<div class=c><b>Журнал</b><div id=lg>${V.log.slice().reverse().map(l=>`<div>${e(l)}</div>`).join('')}</div></div>`}
function draw(){if(!V)return;const a=document.activeElement,id=a&&a.id,val=a&&a.value,ss=a&&a.selectionStart;
 if(V.ph=='lobby')$('#app').innerHTML=lobby();
 else{const me=V.pl.find(p=>p.id==V.me);$('#app').innerHTML=topbar()+`<div class=row><div class=main><div class=g>${[me,...V.pl.filter(p=>p!=me)].map(card).join('')}</div></div><div class=side>${side()}</div></div>`}
 if(id){const n=document.getElementById(id);if(n&&n.type!='file'){n.value=val;n.focus();try{n.setSelectionRange(ss,ss)}catch(x){}}}
 if(V.roll){if(lastSeq===null)lastSeq=V.roll.seq;else if(V.roll.seq!=lastSeq){lastSeq=V.roll.seq;let k=0;const t=setInterval(()=>{const d=$('#dv');if(d)d.textContent=rnd(1,20);if(++k>9){clearInterval(t);if(d)d.textContent=V.roll.t}},60)}}}
home();
</script></body></html>
